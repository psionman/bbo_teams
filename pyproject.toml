[project]
name = "bbo_teams"
version = "0.0.0"
description = "Set up BBO for a teans of 8 match."
authors = [
    {name = "Jeff Watkins", email = "jeffwatkins2000@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clipboard>=0.0.4",
    "dotenv>=0.9.9",
    "openpyxl>=3.1.5",
    "platformdirs>=4.13.0",
    "playwright>=1.64.1",
    "psiutils>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest",
    "jedi>=0.19.2",
    "ruff>=0.11.0",
]

[build-system]
requires = ['uv-build']
build-backend = 'uv_build'

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.uv.sources]
psiutils = { path = "../../psi-utilities/psiutils", editable = true }
